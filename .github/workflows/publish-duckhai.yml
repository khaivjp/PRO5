name: Publish duckhai.id.vn, HVU Bank and Life

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: duckhai-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout PRO5
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: false

      - name: Checkout HVU Bank
        uses: actions/checkout@v4
        with:
          repository: khaivjp/hvu-blue-bank
          ref: main
          path: bank
          persist-credentials: false

      - name: Checkout Life
        uses: actions/checkout@v4
        with:
          repository: khaivjp/life
          ref: main
          path: life-source
          persist-credentials: false

      - name: Assemble website
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site/hvubank site/life

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='README*' \
            bank/ site/hvubank/

          LIFE_DIR=life-source
          if [ -f life-source/dist/index.html ]; then
            LIFE_DIR=life-source/dist
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='README*' \
            "$LIFE_DIR/" site/life/

          touch site/.nojekyll

          test -f site/index.html
          test -f site/hvubank/index.html
          test -f site/hvubank/app.js
          test -f site/life/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
